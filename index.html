<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="author" content="Muhamad Jaelani" />
  <meta name="description"
    content="Muhamad Jaelani - Full Stack Developer & UI/UX Designer specializing in building premium, high-performance web applications with React, TypeScript, and modern technologies." />

  <meta name="revisit-after" content="7 days" />

  <link rel="canonical" href="https://jaelanim.tech" />
  <link rel="alternate" hrefLang="id" href="https://jaelanim.tech/id" />

  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="/src/assets/logo-dark.png" type="image/x-icon" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jaelanim.tech" />
  <meta property="og:title" content="Muhamad Jaelani | Full Stack Developer & UI/UX Designer" />
  <meta property="og:description"
    content="Building premium, high-performance web applications with React, TypeScript, and modern design principles." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@zyxevls" />
  <meta name="twitter:url" content="https://jaelanim.tech" />
  <meta name="twitter:title" content="Muhamad Jaelani | Full Stack Developer & UI/UX Designer" />

    content="Building premium, high-performance web applications with React, TypeScript, and modern design principles." />
  <meta name="twitter:image" content="https://jaelanim.tech/og-image.png" />
  <meta name="twitter:creator" content="@zyxevls" />

  <!-- LinkedIn -->
  <meta property="article:author" content="https://linkedin.com/in/muhamadjaelani" />

  <title>Muhamad Jaelani | Full Stack Developer & UI/UX Designer</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap"
    rel="stylesheet">

  <!-- Image preload optimization -->
  <link rel="preload" href="/public/img/profile.png" as="image" type="image/png" media="(min-width: 768px)" />
  <link rel="prefetch" href="/public/img/profile.png" />

  <!-- Favicon optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
